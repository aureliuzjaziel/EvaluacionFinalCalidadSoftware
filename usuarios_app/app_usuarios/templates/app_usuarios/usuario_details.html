<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalles de {{ usuario.nombre_completo }}</title>
    <style>
        body { font-family: sans-serif; background: #eef2f3; padding: 40px; text-align: center; }
        .tarjeta-detalle { background: white; max-width: 450px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .galeria { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .info { text-align: left; background: #f8f9fa; padding: 15px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="tarjeta-detalle">
        <a href="{% url 'lista_usuarios' %}">← Volver al listado</a>
        <h2>{{ usuario.nombre_completo }}</h2>
        
        <h3>Variantes de Imágenes en Servidor:</h3>
        <div class="galeria">
            <img src="{{ usuario.imagen_large }}" title="Grande" style="width:120px; border-radius:8px;">
            <img src="{{ usuario.imagen_medium }}" title="Mediana" style="width:80px; height:80px; border-radius:8px;">
            <img src="{{ usuario.imagen_thumbnail }}" title="Miniatura" style="width:50px; height:50px; border-radius:8px;">
        </div>

        <div class="info">
            <p><strong>Género:</strong> {{ usuario.genero }}</p>
            <p><strong>Edad:</strong> {{ usuario.edad }} años</p>
            <p><strong>Email:</strong> {{ usuario.email }}</p>
            <p><strong>Ciudad de Residencia:</strong> {{ usuario.ciudad }}</p>
            <p><strong>Registrado el:</strong> {{ usuario.fecha_registro }}</p>
        </div>
    </div>
</body>
</html>
