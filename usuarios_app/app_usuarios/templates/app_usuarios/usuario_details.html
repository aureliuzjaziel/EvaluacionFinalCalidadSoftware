<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Detalles de {{ usuario.nombre_completo }}</title>
    <style>
      body {
        font-family: sans-serif;
        background: #eef2f3;
        padding: 40px;
        text-align: center;
      }
      .tarjeta-detalle {
        background: white;
        max-width: 450px;
        margin: 0 auto;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .foto-usuario {
        width: 160px;
        height: 160px;
        object-fit: cover;
        border-radius: 8px;
        margin: 20px 0;
      }
      .info {
        text-align: left;
        background: #f8f9fa;
        padding: 15px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="tarjeta-detalle">
      <a href="{% url 'lista_usuarios' %}">← Volver al listado</a>
      <h2>{{ usuario.nombre_completo }}</h2>

      <img
        class="foto-usuario"
        src="{{ usuario.imagen_large }}"
        alt="Foto de {{ usuario.nombre_completo }}"
      />

      <div class="info">
        <p><strong>Género:</strong> {{ usuario.genero }}</p>
        <p><strong>Edad:</strong> {{ usuario.edad }} años</p>
        <p><strong>Email:</strong> {{ usuario.email }}</p>
        <p><strong>Ciudad de Residencia:</strong> {{ usuario.ciudad }}</p>
        <p><strong>Registrado el:</strong> {{ usuario.fecha_registro }}</p>
      </div>
    </div>
  </body>
</html>
